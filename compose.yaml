services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sukoondesk
      POSTGRES_USER: sukoondesk
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - sukoondesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukoondesk -d sukoondesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sukoondesk-postgres:
