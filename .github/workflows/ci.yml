name: CI

on:
  push:
    branches: [main, staging, shoaib-dev]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: dotnet restore src/SukoonDesk.Api/SukoonDesk.Api.csproj
      - run: dotnet build src/SukoonDesk.Api/SukoonDesk.Api.csproj -c Release --no-restore
      - run: docker build -t sukoondesk:${{ github.sha }} .
